<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/css/style.css">
    <title>Central de chamados</title>
</head>
<body>
    <main class="container entry-page">
        <header class="header">
            <h1>Central de chamados</h1>
        </header>
        <section class="entry-options" aria-label="Escolha seu acesso">
            <a class="entry-option" href="/chamados">
                <span class="entry-kicker">CLIENTE</span>
                <strong>Acompanhar meus chamados</strong>
                <span>Consulte ou abra um chamado associado ao seu nome.</span>
            </a>
            <a class="entry-option" href="/responsavel">
                <span class="entry-kicker">ATENDIMENTO</span>
                <strong>Área do responsável</strong>
                <span>Veja os chamados da sua fila e atualize o atendimento.</span>
            </a>
        </section>
    </main>
</body>
</html>
